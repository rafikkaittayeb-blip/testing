services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # local only: approve/reject has no login
    env_file:
      - path: .env
        required: false
    environment:
      SEARXNG_URL: http://searxng:8080
      MODE: ${MODE:-auto}
    volumes:
      - ./runs:/srv/runs
      - ./outbox:/srv/outbox
    depends_on:
      - searxng
  searxng:
    image: searxng/searxng:2026.11.14-a7128d5d1@sha256:eb8b09ffa83aebbe8b8d3ded23cfd224b2d3b01db4f3af9eb03876ef6def6dda
    ports:
      - "127.0.0.1:8080:8080"   # local only, so the CLI on the host can search too
    environment:
      SEARXNG_SECRET: local-dev-only-not-a-secret
    volumes:
      - ./config/searxng:/etc/searxng
